name: Memory UX branch validation

on:
  push:
    branches:
      - feature/memory-ux-undo-recent
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run memory UX integration test
        run: node tests/integration/memory_ux.test.js

      - name: Run full test suite
        run: npm test
