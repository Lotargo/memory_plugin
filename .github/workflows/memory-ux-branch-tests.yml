name: Memory UX branch validation

on:
  push:
    branches:
      - feature/memory-ux-undo-recent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/integration/memory_ux.test.js
      - run: npm test
